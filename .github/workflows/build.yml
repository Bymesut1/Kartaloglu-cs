name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build
        run: gradle make makePluginsJson

      - name: Publish builds branch
        run: |
          mkdir out
          cp DiziMom/build/*.cs3 out/
          cp MailRu/build/*.cs3 out/
          cp Filmmakinesi/build/*.cs3 out/
          cp FilmDozu/build/*.cs3 out/
          cp CizgiMax/build/*.cs3 out/
          cp HDFilmCehennemi/build/*.cs3 out/
          cp Okru/build/*.cs3 out/
          cp SezonlukDizi/build/*.cs3 out/
          cp Webteizle/build/*.cs3 out/
          cp JetFilmizle/build/*.cs3 out/
          cp DiziCehennemi/build/*.cs3 out/
          cp FullHDFilmizlesene/build/*.cs3 out/
          cp VkVideo/build/*.cs3 out/
          cp Zdizi/build/*.cs3 out/
          cp Dizilla/build/*.cs3 out/
          cp Selcukflix/build/*.cs3 out/
          cp DiziLife/build/*.cs3 out/
          cp DiziPal/build/*.cs3 out/
          cp DiziSol/build/*.cs3 out/
          cp RecTV/build/*.cs3 out/
          cp DiziYou/build/*.cs3 out/
          cp SetFilmIzle/build/*.cs3 out/
          cp FilmizleHell/build/*.cs3 out/
          cp WebDramaTurkey2/build/*.cs3 out/
          cp DiziPod/build/*.cs3 out/
          cp BuzFilmizle3/build/*.cs3 out/
          cp ZipFilmizle/build/*.cs3 out/
          cp FilmEkseni/build/*.cs3 out/
          cp HDFilmCehennemiland/build/*.cs3 out/
          cp YouTube/build/*.cs3 out/
          cp build/plugins.json out/
          cd out
          git init -b builds
          git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "build"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} builds
