name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build
        run: gradle make makePluginsJson

      - name: Publish builds branch
        run: |
          mkdir out
          cp Wfilmizle/build/*.cs3 out/
          cp MailRu/build/*.cs3 out/
          cp Dizidad/build/*.cs3 out/
          cp Filmmakinesi/build/*.cs3 out/
          cp FilmDozu/build/*.cs3 out/
          cp CizgiMax/build/*.cs3 out/
          cp HDFilmCehennemi/build/*.cs3 out/
          cp build/plugins.json out/
          cd out
          git init -b builds
          git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "build"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} builds
